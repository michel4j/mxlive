{% extends "dashboard/cards/base_card.html" %}

{% block card_body_class %} p-0 {% endblock %}
{% block card_content %}
    <div class="list-group list-group-flush list-group-hover">
    {% for connection in connections %}
        {% include "acl/connection-list-item.html" %}
    {% empty %}
        <div class="list-group-item empty">
            No active connections at the moment.
        </div>
    {% endfor %}
    </div>
{% endblock %}
