<div class="card mb-4 {% block card_class %}text-bg-cat-9{% endblock %}">
    {% if card.title or title %}
    <div class="card-header text-center text-wide text-muted">
        <small>{{ card.title|default:title }}</small>
    </div>
    {% endif %}
    <div class="card-body {% block card_body_class %}{% endblock %}">
    {% block card_content %}{% endblock %}
    </div>
</div>
