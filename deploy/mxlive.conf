
ServerName  "${SERVER_NAME}"

# Explicitly load required modules for Debian
<IfModule !mod_wsgi.c>
    LoadModule wsgi_module /usr/lib/apache2/modules/mod_wsgi.so
</IfModule>

<VirtualHost *:80>

    Alias /media/ /mxlive/local/media/
    Alias /static/ /mxlive/static/

    <Directory /mxlive/local/media>
        Require all granted
    </Directory>

    <Directory /mxlive/static>
        Require all granted
    </Directory>

    WSGIDaemonProcess mxlive python-home=/venv python-path=/mxlive
    WSGIProcessGroup mxlive
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /mxlive/mxlive/wsgi.py

    <Directory /mxlive/mxlive>
	    <Files wsgi.py>
		    Require all granted
	    </Files>
    </Directory>

 	LogFormat "%h (%{X-Forwarded-For}i) %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-agent}i\"" combined_with_forwarded_for
    CustomLog /mxlive/local/logs/access_log combined_with_forwarded_for
    ErrorLog  /mxlive/local/logs/error_log

</VirtualHost>

<IfModule mod_headers.c>
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=()"
</IfModule>
